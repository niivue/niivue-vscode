name: Release Coordinator

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      # Pushes and pull requests made with the workflow's own GITHUB_TOKEN do
      # not start other workflows, so the version PR would get no CI and the
      # release tags would not start the release workflows. The release app's
      # token does both.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Opens or updates the version PR while changesets are pending. After it is
      # merged, `changeset publish` tags each bumped package, and every
      # `<package>@<version>` tag starts that app's release workflow. Tags go out
      # one git push each; GitHub starts no workflows for a push of more than
      # three tags.
      - name: Create Version PR or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ steps.app-token.outputs.token }}
          push-with-git-cli: true
          create-github-releases: false
