name: Release JupyterLab Extension

on:
  push:
    tags:
      - '@niivue/jupyter@*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Must run before `Build extension`: the build calls
      # `jupyter labextension build`, which is provided by the
      # `jupyterlab` Python package.
      - name: Install Python build tools
        run: python -m pip install "jupyterlab>=4.0.0,<5" build twine

      - name: Build extension
        run: pnpm turbo build --filter=@niivue/jupyter

      - name: Build Python package
        working-directory: ./apps/jupyter
        run: python -m build

      - name: Check Python package
        working-directory: ./apps/jupyter
        run: python -m twine check dist/*

      - name: Publish to PyPI
        working-directory: ./apps/jupyter
        run: python -m twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jupyter-extension
          path: apps/jupyter/dist/*

