name: Release JupyterLab Extension

on:
  push:
    tags:
      - '@niivue/jupyter@*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Must run before `Build extension`: the build calls
      # `jupyter labextension build`, which is provided by the
      # `jupyterlab` Python package.
      - name: Install Python build tools
        run: python -m pip install "jupyterlab>=4.0.0,<5" build twine

      - name: Build extension
        run: pnpm turbo build --filter=@niivue/jupyter

      - name: Build Python package
        working-directory: ./apps/jupyter
        run: python -m build

      - name: Check Python package
        working-directory: ./apps/jupyter
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jupyter-extension
          path: apps/jupyter/dist/*
          overwrite: true

  # PyPI Trusted Publishing: PyPI trades this job's OIDC token for a
  # short-lived upload token. Only this job may request one, so no build
  # script runs with it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jupyterlab-niivue
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jupyter-extension
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

