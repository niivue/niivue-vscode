name: Pre-release

# Weekly betas of the apps that pending changesets bump. Beta versions derive
# from the next stable those changesets describe:
#   - VS Code: <major>.<next odd minor>.<run>  (next stable 2.10.0 -> 2.11.<run>)
#   - PyPI:    <next stable>.dev<run>         (installed only with `pip install --pre`)
#   - Desktop: <next stable>-beta.<run>, as a GitHub pre-release with installers
# Each beta ships the changelog section of that next stable. Stable releases
# go through the version PR (release-coordinator.yml). workflow_dispatch
# publishes a beta off schedule.

on:
  schedule:
    # Mondays at 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prerelease:
    name: Build and publish pre-releases
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.encode.outputs.desktop }}
      desktop_version: ${{ steps.encode.outputs.desktop_version }}
      desktop_notes: ${{ steps.encode.outputs.desktop_notes }}

    steps:
      # Full history: changelog entries link the pull request that added each
      # changeset.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      # Changesets with empty frontmatter bump nothing and do not count.
      - name: Detect whether a pre-release is needed
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            last=$(gh run list --workflow prerelease.yml --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""')
            if [ "$last" = "$GITHUB_SHA" ]; then
              echo "has_changesets=false" >> "$GITHUB_OUTPUT"
              echo "The last successful run already built $GITHUB_SHA; skipping."
              exit 0
            fi
          fi

          shopt -s nullglob
          count=0
          for f in .changeset/*.md; do
            [ "$(basename "$f")" = "README.md" ] && continue
            if ! awk '/^---$/{c++; next} c==1 && NF>0' "$f" | grep -q .; then
              echo "  skipping empty changeset: $(basename "$f")"
              continue
            fi
            count=$((count + 1))
          done
          if [ "$count" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Found $count pending changeset(s)."
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets; skipping pre-release."
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.detect.outputs.has_changesets == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: steps.detect.outputs.has_changesets == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        if: steps.detect.outputs.has_changesets == 'true'
        with:
          python-version: '3.11'

      - name: Install JS dependencies
        if: steps.detect.outputs.has_changesets == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Python build tools
        if: steps.detect.outputs.has_changesets == 'true'
        run: python -m pip install "jupyterlab>=4.0.0,<5" build twine

      # `changeset status --output` writes the release plan ({name, oldVersion,
      # newVersion, type} per bumped package) without touching any file.
      - name: Compute release plan
        if: steps.detect.outputs.has_changesets == 'true'
        run: pnpm changeset status --output=changeset-status.json

      # Nothing is committed; the files only go into this run's packages.
      - name: Write changelog sections
        if: steps.detect.outputs.has_changesets == 'true'
        run: |
          pnpm changeset version
          node scripts/release/polish-changelogs.mjs

      - name: Encode pre-release versions per target
        if: steps.detect.outputs.has_changesets == 'true'
        id: encode
        run: |
          node scripts/release/encode-prerelease-versions.mjs ${{ github.run_number }}
          target() { node -p "require('./prerelease-targets.json').$1 || ''"; }
          {
            echo "vscode=$(target vscode)"
            echo "jupyter=$(target jupyter)"
            echo "streamlit=$(target streamlit)"
            echo "desktop=$(target desktop)"
            echo "desktop_version=$(target desktopVersion)"
            if [ "$(target desktop)" = "true" ]; then
              echo 'desktop_notes<<NOTES_EOF'
              node scripts/release/changelog-section.mjs apps/desktop-tauri/CHANGELOG.md
              echo 'NOTES_EOF'
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build all apps
        if: steps.detect.outputs.has_changesets == 'true'
        run: pnpm turbo build

      # ── VS Code ────────────────────────────────────────────────────────────
      - name: Package VS Code extension
        if: steps.encode.outputs.vscode == 'true'
        run: pnpm vsce package --pre-release --no-dependencies
        working-directory: ./apps/vscode

      - name: Publish to VS Code Marketplace
        if: steps.encode.outputs.vscode == 'true'
        run: pnpm vsce publish --pre-release --packagePath *.vsix
        working-directory: ./apps/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: steps.encode.outputs.vscode == 'true'
        run: pnpm ovsx publish *.vsix --pre-release
        working-directory: ./apps/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      # ── JupyterLab ─────────────────────────────────────────────────────────
      - name: Build JupyterLab Python package
        if: steps.encode.outputs.jupyter == 'true'
        run: python -m build
        working-directory: ./apps/jupyter

      - name: Publish JupyterLab to PyPI
        if: steps.encode.outputs.jupyter == 'true'
        run: python -m twine upload dist/*
        working-directory: ./apps/jupyter
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      # ── Streamlit ──────────────────────────────────────────────────────────
      - name: Build Streamlit Python package
        if: steps.encode.outputs.streamlit == 'true'
        run: python -m build
        working-directory: ./apps/streamlit

      - name: Publish Streamlit to PyPI
        if: steps.encode.outputs.streamlit == 'true'
        run: python -m twine upload dist/*
        working-directory: ./apps/streamlit
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  # ── Desktop (Tauri) ────────────────────────────────────────────────────────
  # The installers need a platform matrix, so release_desktop.yml builds them
  # and creates the GitHub pre-release.
  desktop:
    name: Build and publish desktop pre-release
    needs: prerelease
    if: needs.prerelease.outputs.desktop == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release_desktop.yml
    with:
      version: ${{ needs.prerelease.outputs.desktop_version }}
      notes: ${{ needs.prerelease.outputs.desktop_notes }}
    secrets: inherit
