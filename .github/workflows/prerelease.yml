name: Pre-release

# Weekly betas of the apps that pending changesets bump. Beta versions derive
# from the next stable those changesets describe:
#   - VS Code: <major>.<next odd minor>.<run>  (next stable 2.10.0 -> 2.11.<run>)
#   - PyPI:    <next stable>.dev<run>         (installed only with `pip install --pre`)
#   - Desktop: <next stable>-beta.<run>, as a GitHub pre-release with installers
# Each beta ships the changelog section of that next stable. Stable releases
# go through the version PR (release-coordinator.yml). workflow_dispatch
# publishes a beta off schedule.
#
# Every app builds and publishes in its own job, so a failing registry does not
# hold back the others. Publishing skips versions that are already out, so a
# failed job can be re-run on its own.

on:
  schedule:
    # Mondays at 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Plan pre-releases
    runs-on: ubuntu-latest
    outputs:
      vscode: ${{ steps.prepare.outputs.vscode }}
      jupyter: ${{ steps.prepare.outputs.jupyter }}
      streamlit: ${{ steps.prepare.outputs.streamlit }}
      desktop: ${{ steps.prepare.outputs.desktop }}
      desktop_version: ${{ steps.prepare.outputs.desktop_version }}
      desktop_notes: ${{ steps.prepare.outputs.desktop_notes }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      # Changesets with empty frontmatter bump nothing and do not count.
      - name: Detect whether a pre-release is needed
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            last=$(gh run list --workflow prerelease.yml --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""')
            if [ "$last" = "$GITHUB_SHA" ]; then
              echo "has_changesets=false" >> "$GITHUB_OUTPUT"
              echo "The last successful run already built $GITHUB_SHA; skipping."
              exit 0
            fi
          fi

          shopt -s nullglob
          count=0
          for f in .changeset/*.md; do
            [ "$(basename "$f")" = "README.md" ] && continue
            if ! awk '/^---$/{c++; next} c==1 && NF>0' "$f" | grep -q .; then
              echo "  skipping empty changeset: $(basename "$f")"
              continue
            fi
            count=$((count + 1))
          done
          if [ "$count" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Found $count pending changeset(s)."
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets; skipping pre-release."
          fi

      - name: Prepare pre-release
        id: prepare
        if: steps.detect.outputs.has_changesets == 'true'
        uses: ./.github/actions/prepare-prerelease

  vscode:
    name: VS Code pre-release
    needs: plan
    if: needs.plan.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/prepare-prerelease

      - name: Build
        run: pnpm turbo build --filter=niivue

      - name: Package
        id: package
        run: pnpm vsce package --pre-release --no-dependencies
        working-directory: ./apps/vscode

      - name: Publish to VS Code Marketplace
        run: pnpm vsce publish --pre-release --packagePath *.vsix --skip-duplicate
        working-directory: ./apps/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: pnpm ovsx publish *.vsix --pre-release --skip-duplicate
        working-directory: ./apps/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  jupyter:
    name: JupyterLab pre-release
    needs: plan
    if: needs.plan.outputs.jupyter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/prepare-prerelease

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'

      # The extension build runs `jupyter labextension build`.
      - name: Install Python build tools
        run: python -m pip install "jupyterlab>=4.0.0,<5" build twine

      - name: Build
        run: pnpm turbo build --filter=@niivue/jupyter

      - name: Build Python package
        run: python -m build
        working-directory: ./apps/jupyter

      - name: Publish to PyPI
        run: python -m twine upload --skip-existing dist/*
        working-directory: ./apps/jupyter
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  streamlit:
    name: Streamlit pre-release
    needs: plan
    if: needs.plan.outputs.streamlit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/prepare-prerelease

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'

      - name: Install Python build tools
        run: python -m pip install build twine

      - name: Build
        run: pnpm turbo build --filter=@niivue/streamlit

      - name: Build Python package
        run: python -m build
        working-directory: ./apps/streamlit

      - name: Publish to PyPI
        run: python -m twine upload --skip-existing dist/*
        working-directory: ./apps/streamlit
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  # The installers need a platform matrix, so release_desktop.yml builds them
  # and creates the GitHub pre-release.
  desktop:
    name: Desktop pre-release
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release_desktop.yml
    with:
      version: ${{ needs.plan.outputs.desktop_version }}
      notes: ${{ needs.plan.outputs.desktop_notes }}
    secrets: inherit
