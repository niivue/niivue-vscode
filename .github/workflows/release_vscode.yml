name: Release VS Code Extension

on:
  push:
    tags:
      - 'niivue@*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo build --filter=niivue

      - name: Package extension
        id: package
        run: pnpm vsce package --no-dependencies
        working-directory: ./apps/vscode

      - name: Publish to VS Code Marketplace
        run: pnpm vsce publish --packagePath *.vsix --skip-duplicate
        working-directory: ./apps/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Open VSX does not wait for the Marketplace; skipping published versions
      # lets a failed run be re-run.
      - name: Publish to Open VSX Registry
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: pnpm ovsx publish *.vsix --skip-duplicate
        working-directory: ./apps/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Upload extension artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vscode-extension
          path: apps/vscode/*.vsix
