name: Release Desktop (Tauri)

on:
  push:
    tags:
      - '@niivue/tauri@*'
      - '!@niivue/tauri@*-*'
  workflow_dispatch:
  # Pre-release lane, called from prerelease.yml with the beta version and its
  # release notes. Without them the run releases the version in package.json.
  workflow_call:
    inputs:
      version:
        description: >-
          Beta version to stamp into the desktop manifests. Empty = release the
          version in apps/desktop-tauri/package.json.
        type: string
        required: false
        default: ''
      notes:
        description: >-
          Release notes of the beta. A stable release takes its section of
          apps/desktop-tauri/CHANGELOG.md.
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Intel build, cross-compiled on the Apple Silicon runner.
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo build --filter=@niivue/react

      # Pre-release lane: overwrite the version in package.json,
      # tauri.conf.json and Cargo.toml so the bundle/installer metadata matches
      # the computed beta version. The stable tag lane derives its version from
      # package.json in the next step instead.
      - name: Stamp pre-release version
        if: ${{ inputs.version }}
        run: node scripts/release/set-desktop-version.mjs "${{ inputs.version }}"

      # Stable tag lane: changesets bumps only apps/desktop-tauri/package.json
      # in the "Version Packages" PR; it never touches tauri.conf.json or
      # Cargo.toml, which `tauri build` reads for the bundle/installer version.
      # Derive the version from package.json and stamp all three so the built
      # installer matches the @niivue/tauri@<version> tag this run was
      # dispatched for. Skipped on the pre-release lane (handled above). Uses
      # bash explicitly so the command substitution works on the Windows runner
      # too (its default shell is pwsh).
      - name: Stamp stable version from package.json
        if: ${{ ! inputs.version }}
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop-tauri/package.json').version")
          echo "Stable lane: stamping desktop manifests with $version (from package.json)"
          node scripts/release/set-desktop-version.mjs "$version"

      - name: Build Tauri app
        run: pnpm exec tauri build --target ${{ matrix.target }}
        working-directory: ./apps/desktop-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-linux-${{ matrix.target }}
          path: |
            apps/desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-macos-${{ matrix.target }}
          path: apps/desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-windows-${{ matrix.target }}
          path: apps/desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Prepare release notes
        id: release
        env:
          BETA_VERSION: ${{ inputs.version }}
          BETA_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$BETA_VERSION" ]; then
            version=$BETA_VERSION
            printf '%s\n' "$BETA_NOTES" > notes.md
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./apps/desktop-tauri/package.json').version")
            node scripts/release/changelog-section.mjs apps/desktop-tauri/CHANGELOG.md "$version" > notes.md
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Desktop is the only app released on GitHub, so its latest stable is the
      # repository's latest release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: '@niivue/tauri@${{ steps.release.outputs.version }}'
          target_commitish: ${{ github.sha }}
          name: NiiVue Desktop ${{ steps.release.outputs.version }}
          body_path: notes.md
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.prerelease == 'false' }}
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.exe
