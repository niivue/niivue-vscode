# Deploys the production PWA build (main branch) to the gh-pages root.
# Counterpart to deploy_pwa_preview.yml, which deploys per-PR previews
# under gh-pages/pr-N/.
name: Deploy PWA Production

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Every CI run ends here, pull requests included. Runs that cannot deploy get a
# group of their own, so they never replace a deploy waiting in 'pages'.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')) && 'pages' || format('pages-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # CI runs of pushes in quick succession can finish out of order, and a waiting
  # deploy is replaced by the next one. Deploy main's head once its CI passed.
  latest:
    # A pull request from a fork's own `main` branch also reports head_branch 'main'.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Pick the commit to deploy
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$main_sha&event=push&status=success" --jq .total_count)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$main_sha" = "$TESTED_SHA" ]; then
            echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$passed" -gt 0 ]; then
            echo "main moved on to $main_sha, whose CI passed; deploying that."
            echo "sha=$main_sha" >> "$GITHUB_OUTPUT"
          else
            echo "main moved on to $main_sha, whose CI has not passed (yet); skipping."
          fi

  deploy:
    needs: latest
    if: needs.latest.outputs.sha != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.latest.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PWA
        env:
          NODE_ENV: production
        run: pnpm turbo build --filter=@niivue/pwa

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/pwa/build
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy PWA to GitHub Pages'

      - name: Configure GitHub Pages source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure GitHub Pages is configured to deploy from the gh-pages branch
          response=$(curl -sS -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}') || true
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ] 2>/dev/null; then
            echo "GitHub Pages configured to deploy from gh-pages branch"
          else
            echo "Warning: Could not configure Pages source (HTTP $http_code): $body"
            echo "Please manually set GitHub Pages to deploy from the gh-pages branch in repository Settings > Pages."
          fi
