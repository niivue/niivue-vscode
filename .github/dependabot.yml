# Dependabot config for the niivue-vscode monorepo.
# - npm at the repo root covers all pnpm workspaces (apps/*, packages/*) via the shared pnpm-lock.yaml
# - Updates run monthly and are grouped to keep PR and notification volume low
# - @niivue/niivue core upgrades are tested and bumped by hand; ignore major bumps so they
#   don't surface as auto-PRs

version: 2

updates:
  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    # Same quarantine rationale as npm below. Action tags are not SemVer, so
    # only the flat window applies here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions:
        patterns:
          - '*'

  # npm / pnpm workspaces — root pnpm-lock.yaml covers apps/* and packages/*
  # Keep open-pull-requests-limit low: every npm PR touches the shared
  # pnpm-lock.yaml, so each merge forces every other open PR to rebase.
  # Dependabot still tracks the full backlog and surfaces additional PRs
  # as we merge — lowering the limit reduces churn, not coverage.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    versioning-strategy: 'increase-if-necessary'
    # Quarantine window against poisoned releases: a compromised version is
    # usually yanked within hours, so waiting lets the registry clean up before
    # we pull it in. Security updates ignore cooldown and still land at once.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'javascript'
    ignore:
      # @niivue/niivue major versions are adopted by hand after testing.
      - dependency-name: '@niivue/niivue'
        update-types:
          - 'version-update:semver-major'
      # @types/vscode is a backwards-compat floor, not a routine type update:
      # per VS Code extension guidance it must be <= engines.vscode in
      # apps/vscode/package.json, currently pinned to ^1.70.0 because 1.70 is
      # the last VS Code release that runs on Windows 7. Bumping the types
      # forces bumping the engine, which is a deliberate policy decision —
      # not something to auto-PR. Bump manually when dropping Win7 support.
      - dependency-name: '@types/vscode'
    groups:
      # Frameworks whose packages must move together, majors included.
      # Dependabot assigns each dep to its first matching group.
      jupyterlab:
        patterns:
          - '@jupyterlab/*'
          - '@jupyter/*'
          - '@lumino/*'
      # React/Preact core only. Intentionally NOT using `react-*` so that
      # unrelated React-ecosystem packages (e.g. react-router-dom v7) get
      # their own ungrouped PRs and aren't bundled with a core React bump.
      react-preact:
        patterns:
          - 'react'
          - 'react-dom'
          - 'preact'
          - '@preact/*'
      # Dev tooling cannot reach users, so its minor/patch bumps share one
      # PR that dependabot_auto_merge.yml can merge unattended.
      dev-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      # Runtime minor/patch bumps, reviewed by hand. Majors of either kind
      # fall through and get their own PRs, which keeps them bisectable.
      runtime-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # Python — Streamlit component (published to PyPI as niivue-streamlit)
  - package-ecosystem: 'pip'
    directory: '/apps/streamlit'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    # Quarantine window against poisoned releases: a compromised version is
    # usually yanked within hours, so waiting lets the registry clean up before
    # we pull it in. Security updates ignore cooldown and still land at once.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'python'
    groups:
      streamlit-python:
        patterns:
          - '*'

  # Python — JupyterLab extension (published to PyPI as jupyterlab_niivue)
  - package-ecosystem: 'pip'
    directory: '/apps/jupyter'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    # Quarantine window against poisoned releases: a compromised version is
    # usually yanked within hours, so waiting lets the registry clean up before
    # we pull it in. Security updates ignore cooldown and still land at once.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'python'
    groups:
      jupyter-python:
        patterns:
          - '*'
